name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  ci:
    name: Typecheck · Tests · Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run build

      - name: Tests
        env:
          STELLAR_NETWORK: testnet
          BOT_TOKEN: "1234567890:ci_test_token"
          ENCRYPTION_KEY_HEX: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
          DB_PATH: ":memory:"
          MAX_TRANSFER_AMOUNT: "100"
          MAX_DAILY_AMOUNT: "500"
          CLAIM_EXPIRY_HOURS: "72"
          RATE_LIMIT_MAX: "10"
          RATE_LIMIT_WINDOW_SECONDS: "60"
          USDC_ASSET_CODE: "USDC"
          USDC_ASSET_ISSUER: "GBBD47IF6LWK7P7MDEVSCWR7DPUWV3NY3DTQEVFL4NAT4AQH3ZLLFLA5"
        run: npm test
